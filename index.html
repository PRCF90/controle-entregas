<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Entregas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Controle de Entregas</h2>
    
    <div class="month-filter-box">
        <span>Mês:</span>
        <select id="filtro-mes" onchange="atualizarTela()">
            <option value="2026-01">Janeiro 2026</option>
            <option value="2026-02">Fevereiro 2026</option>
            <option value="2026-03">Março 2026</option>
            <option value="2026-04">Abril 2026</option>
            <option value="2026-05">Maio 2026</option>
            <option value="2026-06">Junho 2026</option>
            <option value="2026-07">Julho 2026</option>
            <option value="2026-08">Agosto 2026</option>
            <option value="2026-09">Setembro 2026</option>
            <option value="2026-10">Outubro 2026</option>
            <option value="2026-11" selected>Novembro 2026</option>
            <option value="2026-12">Dezembro 2026</option>
        </select>
    </div>

    <div class="saldo-box">
        <div>SALDO DO MÊS SELECIONADO</div>
        <h1 id="saldo-total">R$ 0,00</h1>
    </div>

    <!-- ABAS -->
    <div class="tabs">
        <button class="tab active" onclick="mudarAba(0)">Cadastrar</button>
        <button class="tab" onclick="mudarAba(1)">Extrato</button>
        <button class="tab" onclick="mudarAba(2)">99 Food</button>
        <button class="tab" onclick="mudarAba(3)">Keeta</button>
        <button class="tab" onclick="mudarAba(4)">Uber</button>
        <button class="tab" onclick="mudarAba(5)">Anual</button>
    </div>

    <!-- ABA 0: CADASTRAR -->
    <div class="content active" id="aba-0">
        <label>Tipo de Lançamento:</label>
        <select id="tipo" onchange="verificarTipo()">
            <option value="entrada">Entrada (Ganho)</option>
            <option value="saida">Saída (Despesa)</option>
        </select>

        <div id="bloco-app">
            <label>Aplicativo:</label>
            <select id="app-origem">
                <option value="99 Food">99 Food</option>
                <option value="Keeta">Keeta</option>
                <option value="Uber">Uber</option>
            </select>
        </div>

        <div id="bloco-categoria" style="display: none;">
            <label>Categoria da Despesa:</label>
            <input type="text" id="categoria" placeholder="Ex: Gasolina, Manutenção">
        </div>

        <label>Data:</label>
        <input type="date" id="data">

        <label>Descrição (Opcional):</label>
        <input type="text" id="descricao" placeholder="Ex: Corridas noturnas">

        <label>Valor (R$):</label>
        <input type="number" id="valor" step="0.01" placeholder="0.00">

        <button class="btn" onclick="salvar()">Salvar Lançamento</button>
    </div>

    <!-- ABA 1: EXTRATO -->
    <div class="content" id="aba-1">
        <h3>Extrato Geral do Mês</h3>
        <div id="lista-geral"></div>
    </div>

    <!-- ABA 2: 99 FOOD -->
    <div class="content" id="aba-2">
        <h3>Ganhos - 99 Food</h3>
        <div class="subtotal-box">Total: <span id="total-99">R$ 0,00</span></div>
        <div id="lista-99"></div>
    </div>

    <!-- ABA 3: KEETA -->
    <div class="content" id="aba-3">
        <h3>Ganhos - Keeta</h3>
        <div class="subtotal-box">Total: <span id="total-keeta">R$ 0,00</span></div>
        <div id="lista-keeta"></div>
    </div>

    <!-- ABA 4: UBER -->
    <div class="content" id="aba-4">
        <h3>Ganhos - Uber</h3>
        <div class="subtotal-box">Total: <span id="total-uber">R$ 0,00</span></div>
        <div id="lista-uber"></div>
    </div>

    <!-- ABA 5: ANUAL -->
    <div class="content" id="aba-5">
        <h3>Somatório Anual</h3>
        <div id="tabela-anual"></div>
    </div>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
